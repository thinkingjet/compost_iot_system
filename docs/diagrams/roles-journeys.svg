<svg class="fm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1806 783" width="1806" height="783" role="img" aria-label="Owners and researchers. Everyone signs up on one page and picks an account type once. Each type then gets its own pages, and the API checks the type again on every request, reading it from the database: owners cannot reach research data, and researchers cannot reach bins or devices"><style>:root{--bg:#ffffff;--ink:#1b1f24;--muted:#5b6570;--faint:#d3d9e0;--edge:#3f4854;--accent:#d6336c;--chip:#ffffff;--blue-f:#e9f1fe;--blue-s:#5b8def;--blue-b:#f3f7ff;--blue-i:#2456c4;--violet-f:#efebfe;--violet-s:#8b6fe8;--violet-b:#f7f5ff;--violet-i:#5b3fc4;--teal-f:#e0f4f1;--teal-s:#2fa79b;--teal-b:#f0faf8;--teal-i:#17756c;--amber-f:#fdf0d9;--amber-s:#d9952b;--amber-b:#fef8ea;--amber-i:#8f5b07;--green-f:#e5f4e3;--green-s:#4caf50;--green-b:#f2faf1;--green-i:#2a7a2e;--slate-f:#eef1f5;--slate-s:#8c97a8;--slate-b:#f6f8fa;--slate-i:#4a5568}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--ink:#e8ebef;--muted:#9aa4b1;--faint:#39414c;--edge:#b6bfca;--accent:#ff7aa8;--chip:#171b21;--blue-f:#17253f;--blue-s:#5b8def;--blue-b:#111a2c;--blue-i:#9dbbff;--violet-f:#261f45;--violet-s:#9c84f0;--violet-b:#19152e;--violet-i:#c0aeff;--teal-f:#11302d;--teal-s:#3db8ab;--teal-b:#0d2120;--teal-i:#7fd6cc;--amber-f:#3a2a0e;--amber-s:#e0a040;--amber-b:#281e0a;--amber-i:#f0c276;--green-f:#17301a;--green-s:#5dbe61;--green-b:#102212;--green-i:#93d996;--slate-f:#222831;--slate-s:#7e8a9c;--slate-b:#171b22;--slate-i:#b4bdcb}}:root[data-theme="dark"]{--bg:#0f1216;--ink:#e8ebef;--muted:#9aa4b1;--faint:#39414c;--edge:#b6bfca;--accent:#ff7aa8;--chip:#171b21;--blue-f:#17253f;--blue-s:#5b8def;--blue-b:#111a2c;--blue-i:#9dbbff;--violet-f:#261f45;--violet-s:#9c84f0;--violet-b:#19152e;--violet-i:#c0aeff;--teal-f:#11302d;--teal-s:#3db8ab;--teal-b:#0d2120;--teal-i:#7fd6cc;--amber-f:#3a2a0e;--amber-s:#e0a040;--amber-b:#281e0a;--amber-i:#f0c276;--green-f:#17301a;--green-s:#
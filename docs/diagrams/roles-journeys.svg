asharray:1.5 5;stroke-linecap:round;stroke-width:2.1}.fm .edge .head{fill:var(--edge)}.fm .edge.accent path{stroke:var(--accent);stroke-width:2.3}.fm .edge.accent .head{fill:var(--accent)}.fm .chip rect{fill:var(--chip);stroke:var(--faint)}.fm .chip text{font-size:11.5px}.fm .chip circle{fill:var(--ink)}.fm .chip .num{fill:var(--bg);font-size:10px;font-weight:700}.fm .chip.accent rect{stroke:var(--accent)}.fm .chip.accent circle{fill:var(--accent)}.fm .leg{font-size:11.5px;fill:var(--muted)}.fm .frame .fr{fill:var(--b);fill-opacity:.55;stroke:var(--s);stroke-opacity:.75;stroke-width:1.2}.fm .frame.dashed .fr{stroke-dasharray:6 4}.fm .flabel{font-size:12px;font-weight:700;fill:var(--i)}.fm .fsub{font-size:10.5px;font-weight:400;fill:var(--muted)}.fm .phase-l{font-size:11px;font-weight:700;letter-spacing:.08em;fill:var(--ink)}.fm .phase-s{font-size:10px;fill:var(--muted)}.fm .psep{stroke:var(--faint);stroke-width:1.4}.fm .node.planned .box{stroke-dasharray:2.5 3.5;fill-opacity:.5}.fm .node.planned text{opacity:.82}.fm .edge.planned path{stroke:var(--muted);stroke-opacity:.6}.fm .edge.planned .head{fill:var(--muted);fill-opacity:.6}.fm .edge.planned.accent path{stroke:var(--accent)}.fm .edge.planned.accent .head{fill:var(--accent)}.fm .chip.planned text{font-style:italic;fill:var(--muted)}.fm .chip.planned .num{font-style:normal;fill:var(--bg)}.fm .legbox{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:2.5 3.5}</style><rect class="bg" width="1806" height="783"/>
<text class="h1" x="28" y="48">Owners and researchers</text>
<text class="claim" x="28" y="71">Everyone signs up on one page and picks an account type once. Each type then gets its own pages, and the API checks the type again on every request, reading it from the database: owners cannot reach research data, and researchers cannot reach bins or devices.</text>

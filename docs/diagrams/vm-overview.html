</svg></div><figcaption><ol class="steps"><li><b>1</b>A browser looks the name up in DNS, gets the VM&#x27;s address and connects on port 443. All four names (<code>compostiq.win</code>, <code>www</code>, <code>dashboard</code>, <code>api</code>) point at this one VM, and one Let&#x27;s Encrypt certificate covers them all.</li><li><b>2</b>NGINX chooses a site by the name that was asked for. <code>dashboard.compostiq.win</code> goes to the dashboard on <code>127.0.0.1:8050</code>.</li><li><b>3</b>The dashboard builds each page on the server and calls the API over loopback, never through NGINX. A signed-in user&#x27;s browser never talks to the API itself.</li><li><b>4</b>Only the API has the database password. PostgreSQL listens on <code>127.0.0.1:5432</code>, and that port is never opened to the outside.</li><li><b>A</b><code>compostiq.win</code> is plain HTML. Its folder is mounted straight from the repo, so a <code>git pull</code> publishes a change with no restart. Its live figures ask <code>/api/public/*</code>, which NGINX passes to the API&#x27;s <code>/public/*</code>.</li><li><b>B</b>Devices send readings to <code>api.compostiq.win</code>, and researchers&#x27; own scripts call <code>/research/*</code> there with a research key. Sign-in and pairing requests on this name are limited to 10 a minute per address before they reach the API; <code>/research/*</code> has no limit.</li></ol><ul class="notes"><li>PM2 runs the dashboard and the API from <code>deploy/pm2/ecosystem.config.js</code>. It restarts either app when it crashes or passes 500 MB, and starts both again after a reboot. NGINX and PostgreSQL are ordinary systemd services.</li><li>PM2 reads the one <code>.env</code> file and gives each app only the settings it needs, which is how the dashboard never sees <code>DATABASE_URL</code>.</li><li>SSH is not part of this picture: the repo holds no firewall settings, and a deploy is done by logging in to the VM.</li></ul></figcaption></figure></main></body></html>

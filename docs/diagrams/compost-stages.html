</svg></div><figcaption><ul class="notes"><li>Holding 55 °C or more for three days in a row kills pathogens: the EPA Class A sanitation target. Peak decomposition starts once the core has held 55 °C for 6 hours. A bin that never gets that hot, like a small Takakura basket, goes straight from active thermophilic to cooling.</li><li>The ranges, their sources and the ammonia level (0 to 1, relative, not ppm) are in <code>simulator/composting_stages.py</code>. The floor is 28 °C because the pilot site in Mataram is 24 to 32 °C outside.</li><li>The API estimates a real bin&#x27;s stage with a model trained in <code>ml/</code> on cycles simulated from these ranges. Alerts use their own fixed limits.</li></ul></figcaption></figure></main></body></html>

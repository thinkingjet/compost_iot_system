</svg></div><figcaption><ol class="steps"><li><b>1</b>Both kinds of user start on the same sign-up page and choose Compost owner or Researcher. Owner is preselected.</li><li><b>2</b>The type is stored in <code>users.role</code> as <code>owner</code> or <code>researcher</code>. It is chosen once: nothing in the dashboard or the API changes it later, and the account page shows it read-only.</li><li><b>3</b>Each type lands on its own home page with its own menu: <code>/dashboard</code> for owners, <code>/research</code> (the API keys page) for researchers. Only Account is shared. Opening the other type&#x27;s page quietly sends you back to your own home page.</li><li><b>4</b>Owners pair or register devices, create bins, follow them on charts and see alerts.</li><li><b>5</b>Every dashboard page calls the API from the dashboard&#x27;s server with the user&#x27;s token. <code>require_role</code> reads the account type from the database and refuses the wrong type with 403, &quot;Not available to researcher accounts.&quot; An owner only ever gets rows they own.</li><li><b>6</b>The Explore data page shows the research figures as a table with a Daily, Overall and Alerts switch and a CSV download. It calls <code>/research/preview/*</code> with the researcher&#x27;s token, so it needs no key.</li><li><b>7</b>A researcher names and creates a key on the API keys page. The key is shown once; only its SHA-256 hash is stored in <code>research_apikeys</code>. Deleting it stops it working at once.</li><li><b>8</b>The researcher&#x27;s own scripts call <code>/research/overview</code>, <code>/daily</code>, <code>/alerts</code> and <code>/countries</code> with the key in the <code>x-research-key</code> header. The API looks the hash up and also checks that the key&#x27;s account is still a researcher.</li></ol><ul class="notes"><li>The dashboard&#x27;s per-type pages are a convenience. The real control is the API&#x27;s check on every request, using the role stored in the database: the sign-in token carries only the user id and its expiry.</li><li><code>POST /pairing/redeem</code> is the one pairing route with no account check, because the device calls it with a code, not a signed-in user.</li></ul></figcaption></figure></main></body></html>

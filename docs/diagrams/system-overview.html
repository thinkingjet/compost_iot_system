</svg></div><figcaption><ol class="steps"><li><b>1</b>Owners and researchers use the dashboard. It calls the API from its own server with the user&#x27;s token, so the browser never sees the token or talks to the API.</li><li><b>2</b>A compost device sends batches of readings with its own key. It gets that key by pairing with a 6-digit code, or the owner registers it and copies the key over by hand. <code>emulator/</code> plays the device in demos.</li><li><b>3</b>The simulator generates a whole composting cycle on a developer&#x27;s machine and can upload it to <code>/records</code> with a device key.</li><li><b>4</b>Researchers&#x27; own scripts read per-country aggregates with a research key created on the dashboard.</li><li><b>5</b>The public website is plain HTML pages, served straight from the repo.</li><li><b>6</b>Only the API has the database password. Every rule about who may see or change what is checked there, next to the data.</li><li><b>7</b>To estimate a bin&#x27;s composting stage, the API runs the stage model trained in <code>ml/</code> on the bin&#x27;s temperature and moisture readings.</li></ol><ul class="notes"><li>In production, devices, scripts and the website reach the API through NGINX on one VM, and the dashboard calls it over the VM&#x27;s loopback address. The production VM diagram shows how.</li><li>Three credentials never stand in for each other: a device key only sends readings, a user token only works for its account type, and a research key only reads research data.</li></ul></figcaption></figure></main></body></html>

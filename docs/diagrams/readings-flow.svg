<svg class="fm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1665 735" width="1665" height="735" role="img" aria-label="Readings in, charts, stage and alerts out. A batch of readings and the alerts it triggers are saved together or not at all. The dashboard reads them back per bin, only from the signed-in owner&#x27;s bins, as charts, a stage estimate and alerts with suggested steps"><style>:root{--bg:#ffffff;--ink:#1b1f24;--muted:#5b6570;--faint:#d3d9e0;--edge:#3f4854;--accent:#d6336c;--chip:#ffffff;--blue-f:#e9f1fe;--blue-s:#5b8def;--blue-b:#f3f7ff;--blue-i:#2456c4;--violet-f:#efebfe;--violet-s:#8b6fe8;--violet-b:#f7f5ff;--violet-i:#5b3fc4;--teal-f:#e0f4f1;--teal-s:#2fa79b;--teal-b:#f0faf8;--teal-i:#17756c;--amber-f:#fdf0d9;--amber-s:#d9952b;--amber-b:#fef8ea;--amber-i:#8f5b07;--green-f:#e5f4e3;--green-s:#4caf50;--green-b:#f2faf1;--green-i:#2a7a2e;--slate-f:#eef1f5;--slate-s:#8c97a8;--slate-b:#f6f8fa;--slate-i:#4a5568}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--ink:#e8ebef;--muted:#9aa4b1;--faint:#39414c;--edge:#b6bfca;--accent:#ff7aa8;--chip:#171b21;--blue-f:#17253f;--blue-s:#5b8def;--blue-b:#111a2c;--blue-i:#9dbbff;--violet-f:#261f45;--violet-s:#9c84f0;--violet-b:#19152e;--violet-i:#c0aeff;--teal-f:#11302d;--teal-s:#3db8ab;--teal-b:#0d2120;--teal-i:#7fd6cc;--amber-f:#3a2a0e;--amber-s:#e0a040;--amber-b:#281e0a;--amber-i:#f0c276;--green-f:#17301a;--green-s:#5dbe61;--green-b:#102212;--green-i:#93d996;--slate-f:#222831;--slate-s:#7e8a9c;--slate-b:#171b22;--slate-i:#b4bdcb}}:root[data-theme="dark"]{--bg:#0f1216;--ink:#e8ebef;--muted:#9aa4b1;--faint:#39414c;--edge:#b6bfca;--accent:#ff7aa8;--chip:#171b21;--blue-f:#17253f;--blue-s:#5b8def;--blue-b:#111a2c;--blue-i:#9dbbff;--violet-f:#261f45;--violet-s:#9c84f0;--violet-b:#19152e;--violet-i:#c0aeff;--teal-f:#11302d;--teal-s:#3db8ab;--teal-b:#0d2120;--teal-i:#7fd6cc;--amber-f:#3a2a0e;--amber-s:#e0a040;--amber-b:#281e0a;--amber-i:#f0c276;--green-f:#17301a;--green-s:#5dbe61;--green-b:#102212;--green-i:#93d996;--slate-f:#222831;--slate-s:#7e8a9c;--slate-b:#171b22;--slate-i:#b4bdcb}.tone-blue{--f:var(--blue-f);--s:var(--blue-s);--b:var(--blue-b);--i:var(--blue-i)}.tone-violet{--f:var(--violet-f);--s:var(--violet-s);--b:var(--violet-b);--i:var(--violet-i)}.tone-teal{--f:var(--teal-f);--s:var(--teal-s);--b:var(--teal-b);--i:var(--teal-i)}.tone-amber{--f:var(--amber-f);--s:var(--amber-s);--b:var(--amber-b);--i:var(--amber-i)}.tone-green{--f:var(--green-f);--s:var(--green-s);--b:var(--green-b);--i:var(--green-i)}.tone-slate{--f:var(--slate-f);--s:var(--slate-s);--b:var(--slate-b);--i:var(--slate-i)}.fm{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}.fm .mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}.fm .bg{fill:var(--bg)}.fm text{fill:var(--ink)}.fm .h1{font-size:20px;font-weight:700}.fm .claim{font-size:13px;fill:var(--muted)}.fm .band{fill:var(--b)}.fm .lane-l{font-size:11px;font-weight:700;letter-spacing:.08em;fill:var(--i)}.fm .lane-s{font-size:10px;fill:var(--muted)}.fm .ghead{font-size:12.5px;font-weight:700}.fm .gline{stroke:var(--faint)}.fm .gsep{stroke:var(--faint);stroke-dasharray:3 5}.fm .box{fill:var(--f);stroke:var(--s);stroke-width:1.3}.fm .ext .box{stroke-dasharray:5 4}.fm .cap{fill:none;stroke:var(--s);stroke-width:1.3}.fm .node.accent .box{stroke:var(--accent);stroke-width:2.2}.fm .t{font-size:13.5px;font-weight:600}.fm .sub{font-size:11.5px;fill:var(--muted)}.fm .tag{font-size:10px;font-weight:700;letter-spacing:.05em;fill:var(--i)}.fm .ann{font-size:10.5px;fill:var(--i)}.fm .fld{font-size:11.5px;white-space:pre}.fm .fty{fill:var(--muted)}.fm .fld.hl{fill:var(--accent);font-weight:700}.fm .div{stroke:var(--s);stroke-opacity:.45}.fm .note-t{font-size:12px;font-style:italic;fill:var(--muted)}.fm .edge path{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linejoin:round}.fm .edge.data path{stroke-dasharray:6 4}.fm .edge.async path{stroke-dasharray:1.5 5;stroke-linecap:round;stroke-width:2.1}.fm .edge .head{fill:var(--edge)}.fm .edge.accent path{stroke:var(--accent);stroke-width:2.3}.fm .edge.accent .head{fill:var(--accent)}.fm .chip rect{fill:var(--chip);stroke:var(--faint)}.fm .chip text{font-size:11.5px}.fm .chip circle{fill:var(--ink)}.fm .chip .num{fill:var(--bg);font-size:10px;font-weight:700}.fm .chip.accent rect{stroke:var(--accent)}.fm .chip.accent circle{fill:var(--accent)}.fm .leg{font-size:11.5px;fill:var(--muted)}.fm .frame .fr{fill:var(--b);fill-opacity:.55;stroke:var(--s);stroke-opacity:.75;stroke-width:1.2}.fm .frame.dashed .fr{stroke-dasharray:6 4}.fm .flabel{font-size:12px;font-weight:700;fill:var(--i)}.fm .fsub{font-size:10.5px;font-weight:400;fill:var(--muted)}.fm .phase-l{font-size:11px;font-weight:700;letter-spacing:.08em;fill:var(--ink)}.fm .phase-s{font-size:10px;fill:var(--muted)}.fm .psep{stroke:var(--faint);stroke-width:1.4}.fm .node.planned .box{stroke-dasharray:2.5 3.5;fill-opacity:.5}.fm .node.planned text{opacity:.82}.fm .edge.planned path{stroke:var(--muted);stroke-opacity:.6}.fm .edge.planned .head{fill:var(--muted);fill-opacity:.6}.fm .edge.planned.accent path{stroke:var(--accent)}.fm .edge.planned.accent .head{fill:var(--accent)}.fm .chip.planned text{font-style:italic;fill:var(--muted)}.fm .chip.planned .num{font-style:normal;fill:var(--bg)}.fm .legbox{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:2.5 3.5}</style><rect class="bg" width="1665" height="735"/>
<text class="h1" x="28" y="48">Readings in, charts, stage and alerts out</text>

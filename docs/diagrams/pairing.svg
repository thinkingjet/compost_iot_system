<g class="edge data"><path d="M1059,936 L1206,936"/><polygon class="head" points="1212,936 1202.5,940.4 1202.5,931.6"/></g>
<g class="node actor tone-green"><rect class="box" x="176" y="138" width="196" height="76" rx="38"/><text class="t" x="274" y="180.5" text-anchor="middle">Asks for a code</text></g>
<g class="node component tone-blue"><rect class="box" x="537" y="138" width="196" height="76" rx="10"/><text class="t" x="635" y="171.5" text-anchor="middle">Pairing wizard</text><text class="sub mono" x="635" y="190" text-anchor="middle">/devices/add</text></g>
<g class="node component tone-teal"><rect class="box" x="863" y="138" width="196" height="76" rx="10"/><text class="t" x="961" y="162.5" text-anchor="middle">Issue a code</text><text class="sub mono" x="961" y="181" text-anchor="middle">POST /pairing/codes</text><text class="sub" x="961" y="199" text-anchor="middle">6 digits, valid 10 min</text></g>
<g class="node actor tone-green"><rect class="box" x="176" y="302" width="196" height="58" rx="29"/><text class="t" x="274" y="326.5" text-anchor="middle">Types it into the</text><text class="t" x="274" y="344.5" text-anchor="middle">device</text></g>
<g class="node component tone-violet"><rect class="box" x="1212" y="302" width="196" height="58" rx="10"/><text class="t" x="1310" y="326.5" text-anchor="middle">Device&#x27;s own page</text><text class="sub mono" x="1310" y="345" text-anchor="middle">POST /api/pair</text></g>
<g class="node component tone-teal"><rect class="box" x="863" y="424" width="196" height="76" rx="10"/><text class="t" x="961" y="448.5" text-anchor="middle">Redeem the code</text><text class="sub mono" x="961" y="467" text-anchor="middle">POST /pairing/redeem</text><text class="sub" x="961" y="485" text-anchor="middle">stores only a hash of the key</text></g>
<g class="node component tone-violet"><rect class="box" x="1212" y="424" width="196" height="76" rx="10"/><text class="t" x="1310" y="457.5" text-anchor="middle">Device keeps its key</text><text class="sub" x="1310" y="476" text-anchor="middle">waits to be set up</text></g>
<g class="node component tone-blue"><rect class="box" x="537" y="564" width="196" height="73" rx="10"/><text class="t" x="635" y="596" text-anchor="middle">Wizard spots it</text><text class="sub" x="635" y="614.5" text-anchor="middle">shows the hardware ID</text></g>
<g class="node component tone-teal"><rect class="box" x="863" y="564" width="196" height="73" rx="10"/><text class="t" x="961" y="588.5" text-anchor="middle">Code status</text><text class="sub mono" x="961" y="607" text-anchor="middle">GET /pairing/codes/</text><text class="sub mono" x="961" y="622" text-anchor="middle">{code}</text></g>
<g class="node actor tone-green"><rect class="box" x="176" y="725" width="196" height="76" rx="38"/><text class="t" x="274" y="767.5" text-anchor="middle">Names it, picks a bin</text></g>
<g class="node component tone-blue"><rect class="box" x="537" y="725" width="196" height="76" rx="10"/><text class="t" x="635" y="767.5" text-anchor="middle">Finish setup</text></g>
<g class="node component tone-teal"><rect class="box" x="863" y="725" width="196" height="76" rx="10"/><text class="t" x="961" y="749.5" text-anchor="middle">Set up the device</text><text class="sub mono" x="961" y="768" text-anchor="middle">POST /devices/{id}/setup</text><text class="sub" x="961" y="786" text-anchor="middle">puts it in the bin</text></g>
<g class="node component tone-teal"><rect class="box" x="863" y="889" width="196" height="76" rx="10"/><text class="t" x="961" y="913.5" text-anchor="middle">Store readings</text><text class="sub mono" x="961" y="932" text-anchor="middle">POST /records</text><text class="sub" x="961" y="950" text-anchor="middle">checks alert rules too</text></g>
<g class="node component tone-violet"><rect class="box" x="1212" y="889" width="196" height="76" rx="10"/><text class="t" x="1310" y="922.5" text-anchor="middle">Sends readings</text><text class="sub mono" x="1310" y="941" text-anchor="middle">x-key header</text></g>
<g class="chip"><rect x="392.1" y="166" width="124.8" height="20" rx="10.0"/><circle cx="402.6" cy="176" r="8.5"/><text class="num" x="402.6" y="179.5" text-anchor="middle">1</text><text x="416.1" y="180">Get pairing code</text></g>
<g class="chip"><rect x="753.2" y="157" width="89.6" height="20" rx="10.0"/><circle cx="763.7" cy="167" r="8.5"/><text class="num" x="763.7" y="170.5" text-anchor="middle">2</text><text x="777.2" y="171">new code</text></g>
<g class="chip"><rect x="770" y="190" width="56" height="20" rx="10.0"/><text x="778" y="204">123456</text></g>
<g class="chip"><rect x="467.8" y="330" width="62.3" height="20" rx="10.0"/><text x="475.8" y="344">shows it</text></g>
<g class="chip accent"><rect x="740.2" y="312" width="103.7" height="20" rx="10.0"/><circle cx="750.7" cy="322" r="8.5"/><text class="num" x="750.7" y="325.5" text-anchor="middle">3</text><text x="764.2" y="326">6-digit code</text></g>
<g class="chip accent"><rect x="1035.2" y="330" width="102.6" height="20" rx="10.0"/><circle cx="1045.7" cy="340" r="8.5"/><text class="num" x="1045.7" y="343.5" text-anchor="middle">4</text><text x="1059.2" y="344">code + MAC</text></g>
<g class="chip accent"><rect x="1079.2" y="452" width="112.6" height="20" rx="10.0"/><circle cx="1089.7" cy="462" r="8.5"/><text class="num" x="1089.7" y="465.5" text-anchor="middle">5</text><text x="1103.2" y="466">API key, once</text></g>
<g class="chip"><rect x="589.7" y="379" width="108.6" height="20" rx="10.0"/><circle cx="600.2" cy="389" r="8.5"/><text class="num" x="600.2" y="392.5" text-anchor="middle">6</text><text x="613.7" y="393">keeps asking</text></g>
<g class="chip"><rect x="754.3" y="581.5" width="87.3" height="20" rx="10.0"/><circle cx="764.8" cy="591.5" r="8.5"/><text class="num" x="764.8" y="595" text-anchor="middle">6</text><text x="778.3" y="595.5">every 2 s</text></g>
<g class="chip"><rect x="764.2" y="614.5" width="67.6" height="20" rx="10.0"/><text x="772.2" y="628.5">redeemed</text></g>
<g class="chip"><rect x="365.4" y="590.5" width="80.2" height="20" rx="10.0"/><text x="373.4" y="604.5">hardware ID</text></g>
<g class="chip"><rect x="409.2" y="753" width="90.7" height="20" rx="10.0"/><circle cx="419.7" cy="763" r="8.5"/><text class="num" x="419.7" y="766.5" text-anchor="middle">7</text><text x="433.2" y="767">name, bin</text></g>
<g class="chip"><rect x="762.7" y="753" width="70.7" height="20" rx="10.0"/><circle cx="773.2" cy="763" r="8.5"/><text class="num" x="773.2" y="766.5" text-anchor="middle">8</text><text x="786.7" y="767">set up</text></g>
<g class="chip"><rect x="1260.1" y="684.5" width="99.7" height="20" rx="10.0"/><text x="1268.1" y="698.5">409 until set up</text></g>
<g class="chip"><rect x="1093.8" y="908" width="83.3" height="20" rx="10.0"/><circle cx="1104.3" cy="918" r="8.5"/><text class="num" x="1104.3" y="921.5" text-anchor="middle">9</text><text x="1117.8" y="922">readings</text></g>
<g class="chip"><rect x="1117.5" y="941" width="36" height="20" rx="10.0"/><text x="1125.5" y="955">200</text></g>
<g class="edge call"><path d="M32,1005 L62,1005"/><polygon class="head" points="68,1005 58.5,1009.4 58.5,1000.6"/></g><text class="leg" x="76" y="1009">calls</text>
<g class="edge data"><path d="M132.335,1005 L162.335,1005"/><polygon class="head" points="168.335,1005 158.835,1009.4 158.835,1000.6"/></g><text class="leg" x="176.335" y="1009">returns / data</text>
<g class="edge async"><path d="M276.37,1005 L306.37,1005"/><polygon class="head" points="312.37,1005 302.87,1009.4 302.87,1000.6"/></g><text class="leg" x="320.37" y="1009">waits, then repeats</text>
<g class="edge call accent"><path d="M453.06500000000005,1005 L483.06500000000005,1005"/><polygon class="head" points="489.06500000000005,1005 479.56500000000005,1009.4 479.56500000000005,1000.6"/></g><text class="leg" x="497.06500000000005" y="1009">code by hand, key straight to the device</text>
<g class="chip"><circle cx="749.3900000000002" cy="1005" r="8.5"/><text class="num" x="749.3900000000002" y="1008.5" text-anchor="middle">n</text></g><text class="leg" x="764.3900000000002" y="1009">step, in order</text>
</svg>
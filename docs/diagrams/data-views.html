</svg></div><figcaption><ol class="steps"><li><b>1</b>Every owner request is answered from the owner&#x27;s own rows only (<code>bins.user_id</code>, <code>devices.owner_id</code>). The owner sees exact readings per device, their alerts and their history, and another owner&#x27;s bin is answered as if it did not exist (404).</li><li><b>2</b>The research routes select only the country and aggregates. Bins without a <code>country_code</code> are left out. Overall gives one row per country for the chosen period (up to 366 days, 30 by default); Daily gives one row per country per UTC day; Alerts gives a count per country and alert type, with the average hours to resolve. Each sensor comes as its average, minimum, maximum and standard deviation.</li></ol><ul class="notes"><li>Every owner&#x27;s bins that have a country are included in the research figures. There is no opt-out.</li></ul></figcaption></figure></main></body></html>

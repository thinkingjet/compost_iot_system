</svg></div><figcaption><ol class="steps"><li><b>1</b>When the VM boots, systemd starts NGINX, PostgreSQL and PM2. Running <code>pm2 startup systemd</code> once installed the unit that starts PM2.</li><li><b>2</b>PM2 comes up and reads the process list that <code>pm2 save</code> stored.</li><li><b>3</b>It starts the dashboard (gunicorn) and the API (uvicorn), each with only its own settings from <code>.env</code>.</li><li><b>4</b>PM2 notices when an app&#x27;s process exits, or when it grows past <code>max_memory_restart: 500M</code>.</li><li><b>5</b>Unless the app has failed ten times in a row, each time within a second of starting, PM2 restarts it.</li><li><b>6</b>After <code>restart_delay</code> (3 seconds) a fresh process starts and the app is back, usually before anyone notices.</li><li><b>A</b>Ten quick failures in a row (<code>max_restarts: 10</code>) usually means a start-up problem, such as a missing secret. PM2 stops trying and marks the app errored; <code>pm2 logs</code> shows why.</li><li><b>B</b>A deploy is done by hand on the VM: pull, install, stop the API while the database is backed up and any new migrations run, then reload both apps so they pick up new code and settings.</li></ol><ul class="notes"><li>Only quick failures count towards the ten. An app that runs for a while and then crashes is restarted every time. This is PM2&#x27;s documented <code>min_uptime</code> behaviour (1 second by default), not something set in this repo.</li><li>PM2 restarts a process that has exited, not one that is up but not answering. The repo has no health check or uptime monitor.</li><li>Logs are rotated by <code>pm2-logrotate</code>: 10 MB a file, 7 files kept. A <code>git pull</code> alone publishes the website, but an NGINX config change also has to be copied into <code>/etc/nginx</code> and reloaded.</li></ul></figcaption></figure></main></body></html>

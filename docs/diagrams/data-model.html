</svg></div><figcaption><ul class="notes"><li>Moving a device closes its open assignment and opens a new one, so older readings stay with the bin they were taken in. The database allows only one open assignment per device.</li><li>Deleting an account deletes its bins, and with them their readings and alerts, along with its research keys and pairing codes. Its devices are released (<code>owner_id</code> becomes empty) so they can be paired again.</li><li>Left off: <code>pairing_failures</code> (wrong pairing codes per address, for the 429 limit) and <code>device_maintenance</code>, which the code does not use.</li></ul></figcaption></figure></main></body></html>

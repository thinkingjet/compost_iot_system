</svg></div><figcaption><ol class="steps"><li><b>1</b>The owner chooses Register with API key, then gives the device a name and picks or creates a bin.</li><li><b>2</b>In one transaction the API adds the device with <code>registration = &#x27;manual&#x27;</code> and no MAC, puts it in the bin and issues a key. The database only accepts <code>manual</code> when the MAC is empty.</li><li><b>3</b>The key is shown once on the page, with the address to send readings to. The owner copies it onto the device; readings are accepted at once because the bin is already set.</li><li><b>A</b>A new key is checked three times: the Settings tab only offers the button for a <code>manual</code> device, the API refuses anything else with 409, and the database column the API checks is tied to the device having no MAC. A new key revokes the old one straight away.</li></ol><ul class="notes"><li>The two ways in are kept separate on purpose. Pairing proves the device holds the code; registration trusts the owner to put the key where it belongs.</li><li>The emulator cannot take a key by hand, so this path is tested with <code>emulator/tools/compostiq_test_device.py</code>.</li></ul></figcaption></figure></main></body></html>

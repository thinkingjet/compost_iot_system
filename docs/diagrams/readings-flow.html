</svg></div><figcaption><ol class="steps"><li><b>1</b>The device takes a reading every 30 seconds and sends what it has queued, up to 50 at a time, to <code>POST /records</code> with its key in the <code>x-key</code> header.</li><li><b>2</b>The API looks the key up by its hash. In a transaction of its own it notes the time of contact on the device, so that is kept even when the upload is then refused with 409.</li><li><b>3</b>If the device is in a bin, each new reading is checked against five rules: above 70 °C, moisture below 30 % or above 70 %, oxygen below 1 %, CO₂ above 12 %. A rule newly broken opens an incident; one back in range resolves it.</li><li><b>4</b>In the same transaction the readings are saved, each tagged with its device and bin. If anything fails, the alerts and the readings are rolled back together.</li><li><b>5</b>The dashboard&#x27;s server asks for a bin&#x27;s readings (or, on a device&#x27;s page, <code>GET /devices/{id}/records</code>). The API first checks that the bin belongs to the signed-in owner; someone else&#x27;s bin is answered with 404.</li><li><b>6</b>The bin&#x27;s Live tab asks for a stage estimate. The API averages the bin&#x27;s last 60 days of core temperature and moisture onto a 30-minute grid and runs the stage model from <code>ml/</code>. With less than a day of readings it gives no stage.</li><li><b>7</b>Alert cards show the open incidents plus an <code>offline</code> alert for any device in a bin that has not been heard from for 10 minutes. Offline alerts are worked out on each request and never stored. Only the overview page refreshes its cards, every 60 seconds.</li><li><b>8</b>A bin&#x27;s Maintenance tab loads that bin&#x27;s open alerts and shows three suggested steps for each alert type. The steps are written into the dashboard (<code>MAINTENANCE_STEPS</code> in <code>pages.py</code>), taken from composting guides, and the API holds none of them.</li></ol><ul class="notes"><li>Every owner-facing read is scoped to the owner in SQL, by <code>bins.user_id</code> or <code>devices.owner_id</code>.</li><li>There is no ammonia rule: the sensor gives a relative level, not a concentration.</li><li>Offline means 10 minutes in both the alerts and the device cards, but the rules differ: a card looks at the last contact only, while the alert also counts from pairing and covers only devices in a bin. A newly registered device shows Offline at once but raises no alert for 10 minutes.</li></ul></figcaption></figure></main></body></html>

# CompostIQ - NGINX reverse proxy with TLS (Let's Encrypt)
# Install: /etc/nginx/sites-available/compostiq.conf, symlink into sites-enabled.
# Get the certificate BEFORE enabling this file (nginx won't start without it):
#   certbot certonly --nginx -d dashboard.compostiq.win -d api.compostiq.win
# All settings live inside server blocks so they never clash with nginx.conf.

# --- HTTP: ACME challenges + redirect everything else to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.compostiq.win api.compostiq.win;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Dashboard (PM2: compostiq-dashboard) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.compostiq.win;

    ssl_certificate     /etc/letsencrypt/live/dashboard.compostiq.win/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.compostiq.win/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 10M;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# --- API (PM2: compostiq-api) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.compostiq.win;

    ssl_certificate     /etc/letsencrypt/live/dashboard.compostiq.win/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.compostiq.win/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 10M;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
